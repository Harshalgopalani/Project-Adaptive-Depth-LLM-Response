# Dynamic Contextual Depth (DCD) - CI/CD Pipeline
# Author: Harshal Gopalani
# Description: Enterprise-grade pipeline for testing FastAPI backends and publishing Docker images.

name: DCD Backend CI/CD Pipeline

# 1. Triggers: When should this pipeline run?
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. Environment Variables
env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  # ---------------------------------------------------------
  # JOB 1: Continuous Integration (Lint & Test)
  # ---------------------------------------------------------
  build-and-test:
    name: Build, Lint, and Test Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip' # FAANG Best Practice: Cache dependencies to speed up builds

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # In a real repo, we would run: pip install -r requirements.txt
          # For testing this workflow, we install essentials:
          pip install fastapi pydantic groq pytest flake8 httpx

      - name: Enforce Code Quality (Linting)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all other issues as warnings for now
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

      - name: Execute Unit Tests
        run: |
          # Fails the pipeline if any test fails
          pytest src/ --doctest-modules --junitxml=junit/test-results.xml
        env:
          GROQ_API_KEY: "dummy_key_for_ci" # Never use real API keys in CI testing

  # ---------------------------------------------------------
  # JOB 2: Continuous Deployment (Build & Push Docker Image)
  # ---------------------------------------------------------
  publish-image:
    name: Build and Push Docker Image
    needs: build-and-test # Only runs IF the tests pass!
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Only deploy when code is merged to main
    
    permissions:
      contents: read
      packages: write # Needed to upload to GitHub Container Registry

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:latest
          # Assuming you have a Dockerfile in your repo root.
